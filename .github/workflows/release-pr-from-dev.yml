name: Create release PR from dev (clean paths)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to release from
        required: true
        default: dev
      base_branch:
        description: Base branch to open PR against
        required: true
        default: main
      pr_branch:
        description: Release PR branch name
        required: true
        default: codex/release-dev-to-main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean release branch from source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${{ inputs.source_branch }}"
          PR_BRANCH="${{ inputs.pr_branch }}"

          git fetch origin "$SOURCE_BRANCH" "$PR_BRANCH" || true
          git checkout -B "$PR_BRANCH" "origin/$SOURCE_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch demo-ts pudu_reference starter-template-ts .skills

          if git diff --cached --quiet; then
            echo "No forbidden paths found in source branch; no exclusion commit needed."
          else
            git commit -m "chore(release): exclude templates and skills from main"
          fi

          git push --force-with-lease origin "$PR_BRANCH"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_BRANCH="${{ inputs.base_branch }}"
          PR_BRANCH="${{ inputs.pr_branch }}"
          SOURCE_BRANCH="${{ inputs.source_branch }}"

          TITLE="chore(release): sync from ${SOURCE_BRANCH} without templates/skills"
          BODY=$'Auto-generated release PR.\n\nExcluded paths:\n- `demo-ts/`\n- `pudu_reference/`\n- `starter-template-ts/`\n- `.skills/`'

          EXISTING_PR=$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$PR_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Updated existing PR #$EXISTING_PR"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PR_BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Created new PR from $PR_BRANCH to $BASE_BRANCH"
          fi
